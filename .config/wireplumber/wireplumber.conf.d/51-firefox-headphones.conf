# Force Firefox (and all apps) to default to Headphones, never HDMI (which is SUSPENDED)
# Fixes: after reboot/EBUSY crash WirePlumber picks HDMI3 as default -> Firefox no sound
# This policy survives pacman -Syu (user config overlays /usr/share/wireplumber)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HDMI.*" }
    ]
    actions = {
      update-props = {
        # keep HDMI available but lower priority, so Headphones always default
        priority.driver = 100
        priority.session = 100
      }
    }
  }
]

# Also ensure stream restore prefers Headphones for Firefox
wireplumber.settings = {
  # already in default-nodes: Headphones, this just documents intent
}

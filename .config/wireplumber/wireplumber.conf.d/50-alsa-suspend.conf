# Disable PipeWire node suspend to avoid SOF EBUSY + WirePlumber 0.5.16 leak
# See: spa.alsa Device or resource busy 4073/hr, ghost nodes in wpctl status
# User override: sets suspend timeout 0 globally (no auto-suspend)
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# -*- conf -*-


term=foot
font=JetBrainsMono Nerd Font:size=16, Noto Color Emoji:size=14
font-bold=JetBrainsMono Nerd Font:style=Bold:size=16
font-italic=JetBrainsMono Nerd Font:style=Italic:size=16
font-bold-italic=JetBrainsMono Nerd Font:style=Bold Italic:size=16
font-size-adjustment=1.2
gamma-correct-blending=no
selection-target=clipboard

[mouse]
hide-when-typing=yes

[key-bindings]
# Copy the current selection directly to the Wayland system clipboard.
clipboard-copy=none
pipe-selected=[wl-copy] Control+Shift+c

[colors-dark]
alpha=0.8
alpha-mode=default
background=181818
foreground=ffffff

regular0=313539
regular1=b30707
regular2=49d932
regular3=f2e635
regular4=4057db
regular5=b30ad0
regular6=32d0fc
regular7=e0e3e7

bright0=676f78
bright1=e81a1a
bright2=78a670
bright3=faf380
bright4=707fd0
bright5=c583d0
bright6=1eb5e3
bright7=e0e3e7

[scrollback]
# lines=1000
# multiplier=3.0
# indicator-position=relative
# indicator-format=""

[csd]
preferred=none
size=0

[text-bindings]
# tmux enables modifyOtherKeys=2, but foot 1.28 has no plain-Ctrl
# Backspace row and falls back to a bare 0x08 (= Ctrl+H). Send the
# xterm modifyOtherKeys form instead so tmux and fish see Ctrl+Backspace.
\x1b[27;5;127~ = Control+BackSpace
